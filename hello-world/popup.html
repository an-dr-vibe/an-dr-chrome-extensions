<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 300px;
      padding: 20px;
      background: #f5f5f5;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .content p {
      font-size: 14px;
      color: #333;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5568d3;
    }

    button:active {
      background: #4758bb;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      background: #e3f2fd;
      border-left: 3px solid #2196f3;
      border-radius: 4px;
      font-size: 12px;
      color: #1565c0;
      display: none;
    }

    .message.show {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>👋 Hello World</h1>
    <p>Example Extension</p>
  </header>

  <div class="content">
    <p>This is a simple Chrome extension. Click the button to store a message!</p>
    <button id="saveBtn">Save Message</button>
    <div class="message" id="message">✓ Message saved to storage</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
